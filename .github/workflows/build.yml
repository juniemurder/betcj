name: Build SHEETZ!

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS,   os: macos-latest }
          - { name: Linux,   os: ubuntu-latest }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package VST3
        shell: bash
        run: |
          cd build/SHEETZ_artefacts/Release/VST3
          cmake -E tar cf "$GITHUB_WORKSPACE/SHEETZ-${{ matrix.name }}-VST3.zip" --format=zip -- .

      - uses: actions/upload-artifact@v4
        with:
          name: SHEETZ-${{ matrix.name }}-VST3
          path: SHEETZ-${{ matrix.name }}-VST3.zip

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SHEETZ-${{ matrix.name }}-VST3.zip
